        section: 'SABnzbd'
        subtitle: "Client di download Usenet. Richiede URL e chiave API."
        api_key: "Chiave API"
      nzbget:
        section: 'NZBGet'
        subtitle: "Client di download Usenet. Nome utente e password sono facoltativi (reverse proxy / autenticazione disabilitata sulla LAN)."
