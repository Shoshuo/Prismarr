        password: "Password dell'interfaccia web"
        reverse_proxy_hint: "Lascia la password vuota se Deluge è dietro un reverse proxy che gestisce l'autenticazione della sessione."
      transmission:
        section: '⬇️ Transmission'
        subtitle: "Autenticazione tramite l'interfaccia RPC di Transmission."
        user: "Nome utente"
        password: Password
        reverse_proxy_hint: "Lascia nome utente e password vuoti se Transmission è dietro un reverse proxy che gestisce l'autenticazione o se l'autenticazione RPC è disabilitata."
